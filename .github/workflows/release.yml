# Releasing the core: checks first, then the mechanical part.
#
# ./extras/release.sh <version> checks and pushes the tag; the tag does the rest:
#
#     v1.0.0-rc1    a pre-release, in an index of its own
#     v1.0.0        the real thing
#
# Nothing reaches the board manager index unless the checks and every compilation
# have passed. Without a tag the same checks run as an ordinary test: a push to
# main, a pull request or a run started by hand goes through the core check and
# the builds and stops there.
#
# Laid out like XMiniCore's workflow. What differs: the platform archive is
# attached to the GitHub release instead of being committed to gh-pages, and one
# Python script (extras/update_index.py) writes the index, tools included.

name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # needed to create the release and to push to gh-pages

jobs:
  check:
    name: Check the core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consistency and release readiness
        env:
          # Only a tag says which version this is about.
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            python3 extras/check_core.py --tag "$TAG"
          else
            python3 extras/check_core.py
          fi

  compile:
    name: Compile on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      # A release gets all three, an ordinary push or pull request the Linux
      # runner: the three differ in their hook scripts and paths, not in the
      # compiler.
      matrix:
        os: ${{ (github.event_name == 'pull_request'
                 || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')))
                && fromJSON('["ubuntu-latest"]')
                || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    defaults:
      run:
        shell: bash             # also on Windows, where the hooks are .bat anyway
    steps:
      - uses: actions/checkout@v4
        with:
          path: AvrDebugger

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: arduino/setup-arduino-cli@v2

      - name: Put the core where arduino-cli finds it
        run: |
          set -x
          arduino-cli version
          # The blank is deliberate: an unquoted use of a path in a recipe or a
          # hook script only shows when the path has one.
          SKETCHBOOK="$HOME/Arduino with blank"
          arduino-cli config init --overwrite
          arduino-cli config set directories.user "$SKETCHBOOK"
          mkdir -p "$SKETCHBOOK/hardware/AvrDebugger"
          cp -r AvrDebugger "$SKETCHBOOK/hardware/AvrDebugger/avr"
          arduino-cli core update-index
          # The boards borrow core and variants from arduino:avr, and its
          # platform.txt is what this one overrides.
          arduino-cli core install arduino:avr
          arduino-cli core list

      - name: Compile
        run: |
          # The compile recipes are inherited, so compile_all.py does not see
          # that the cpu menu matters (it sets build.mcu); name it.
          python AvrDebugger/extras/compile_all.py --fqbn-prefix AvrDebugger:avr \
                 --menus cpu --work-dir "$HOME/work with blank" --timeout 300

      - name: Check that the prebuild hook picks up the pragmas
        run: |
          python AvrDebugger/extras/check_hooks.py --fqbn AvrDebugger:avr:uno \
                 --work-dir "$HOME/work with blank"

      - name: Check that "Optimize for debugging" reaches the compiler
        run: |
          # The one setting this core exists for. A sketch built with it has to
          # be compiled with -Og, and without it with -Os.
          SKETCH="$HOME/work with blank/opt_probe"
          mkdir -p "$SKETCH"
          printf 'void setup() { }\nvoid loop() { }\n' > "$SKETCH/opt_probe.ino"
          arduino-cli compile -v --clean --optimize-for-debug -b AvrDebugger:avr:uno \
                 "$SKETCH" > debug.log 2>&1 || { cat debug.log; exit 1; }
          arduino-cli compile -v --clean -b AvrDebugger:avr:uno \
                 "$SKETCH" > release.log 2>&1 || { cat release.log; exit 1; }
          grep 'opt_probe.ino.cpp.o' debug.log   | grep -q -- ' -Og ' \
            || { echo "--optimize-for-debug did not give -Og"; exit 1; }
          grep 'opt_probe.ino.cpp.o' release.log | grep -q -- ' -Os ' \
            || { echo "a release build did not give -Os"; exit 1; }
          echo "-Og with, -Os without"

  fallback-build:
    # The kit the other cores carry in INSTALL-the-AvrDebugger-package: stubs
    # that stand in for avr-gdb and pyavrocd when AvrDebugger is not installed,
    # and tell the user so in the gdb-server terminal (see fallback/README.md).
    # Built once here; the tests below and the release use this very archive.
    name: Build the fallback kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Windows stub and pack the kit
        run: |
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 > /dev/null
          KIT=kit/INSTALL-the-AvrDebugger-package/bin
          mkdir -p "$KIT"
          x86_64-w64-mingw32-gcc -std=c99 -Wall -Wextra -Werror -Os -s \
              -o "$KIT/avr-gdb.exe" fallback/stub.c
          cp "$KIT/avr-gdb.exe" "$KIT/pyavrocd.exe"
          install -m 755 fallback/avr-gdb fallback/pyavrocd "$KIT/"
          # tar, not the artifact's zip: the shell stubs need their x bit.
          tar -C kit -czf fallback-kit.tar.gz INSTALL-the-AvrDebugger-package
          tar -tvzf fallback-kit.tar.gz

      - name: Check the shell stubs on Linux
        run: bash fallback/check.sh fallback

      - uses: actions/upload-artifact@v4
        with:
          name: fallback-kit
          path: fallback-kit.tar.gz

  fallback-test:
    name: Fallback kit on ${{ matrix.os }}
    needs: fallback-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fallback-kit

      - name: Unpack
        run: tar -xzf fallback-kit.tar.gz

      - name: Check the shell stubs
        if: runner.os != 'Windows'
        run: bash fallback/check.sh INSTALL-the-AvrDebugger-package/bin

      - name: Check the exe stubs
        if: runner.os == 'Windows'
        run: |
          # Only the exes, so that nothing but them can answer.
          mkdir exe
          cp INSTALL-the-AvrDebugger-package/bin/*.exe exe/
          bash fallback/check.sh exe

      - name: Does a spawn without extension find the exe next to the script?
        if: runner.os == 'Windows'
        run: |
          # cortex-debug spawns .../bin/avr-gdb without a shell and without
          # ".exe", and in the kit a shell script of that very name lies next
          # to avr-gdb.exe. Node has to start the exe all the same.
          BIN=$(cygpath -w "$PWD/INSTALL-the-AvrDebugger-package/bin")
          node -e '
            const cp = require("child_process"), path = require("path");
            const bin = process.argv[1];
            const gdb = cp.spawnSync(path.join(bin, "avr-gdb"), ["-q", "--interpreter=mi2", "x.elf"],
                                     { input: "1-gdb-version\n2-gdb-set target-async on\n" });
            if (gdb.error) { console.log("avr-gdb: " + gdb.error); process.exit(1); }
            const out = gdb.stdout.toString();
            console.log(out);
            if (!/^1\^done/m.test(out)) { console.log("avr-gdb: version check not answered"); process.exit(1); }
            const srv = cp.spawnSync(path.join(bin, "pyavrocd"), ["-s", "nop"], { timeout: 3000 });
            const text = srv.stdout.toString();
            console.log(text);
            if (!/AvrDebugger package is not installed/.test(text)) { console.log("pyavrocd: no message"); process.exit(1); }
            console.log("both found as .exe without the extension");
          ' "$BIN"

  release:
    name: Publish
    runs-on: ubuntu-latest
    needs: [compile, fallback-test]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fallback-kit

      - name: Which version, which index, which PyAvrOCD?
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="AvrDebugger-${VERSION}.tar.bz2"
          # Release candidates go into an index of their own, so the board
          # manager of an ordinary user never offers them. They may depend on a
          # PyAvrOCD pre-release; a real release only on a real one.
          case "${GITHUB_REF_NAME}" in
            *-rc*) INDEX=package_felias-fogg_AvrDebugger_rc_index.json; PYAVROCD=newest ;;
            *)     INDEX=package_felias-fogg_AvrDebugger_index.json;    PYAVROCD=latest ;;
          esac
          {
            echo "VERSION=$VERSION"
            echo "ARCHIVE=$ARCHIVE"
            echo "INDEX_FILE=$INDEX"
            echo "PYAVROCD=$PYAVROCD"
          } >> "$GITHUB_ENV"
          echo "$ARCHIVE goes into $INDEX, with the $PYAVROCD PyAvrOCD"

      - name: Pack the platform
        run: |
          # git archive leaves out what .gitattributes marks export-ignore:
          # .github and extras are not part of what the board manager installs.
          git archive --format=tar --prefix="AvrDebugger-${VERSION}/" HEAD \
            | bzip2 -9 > "$ARCHIVE"
          tar tjf "$ARCHIVE"

      - name: Create the release
        run: |
          # Skipped when the release is already there, so that a re-run of the
          # job, after the index step failed, works.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "the release already exists, leaving it alone"
          else
            NOTES=$(python3 extras/changelog_entry.py "${GITHUB_REF_NAME}")
            PRE=""
            case "${GITHUB_REF_NAME}" in *-rc*) PRE="--prerelease" ;; esac
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
               --notes "$NOTES" $PRE
          fi
          # --clobber replaces an archive of an earlier attempt; the index step
          # refuses a version that is already published with a different one.
          gh release upload "${GITHUB_REF_NAME}" "$ARCHIVE" --clobber
          # The fallback kit for the other cores, the archive tested above. The
          # asset takes the file's own name, so rename it first.
          mv fallback-kit.tar.gz "AvrDebugger-fallback-${VERSION}.tar.gz"
          gh release upload "${GITHUB_REF_NAME}" "AvrDebugger-fallback-${VERSION}.tar.gz" --clobber

      - name: Check out the branch that carries the index
        run: |
          # The first release finds no gh-pages branch, and starts one.
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git clone --quiet --branch gh-pages --single-branch \
                "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
          else
            mkdir pages
            git -C pages init --quiet --initial-branch gh-pages
            git -C pages remote add origin \
                "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

      - name: Add this version to the board manager index
        run: |
          python3 extras/update_index.py --index "pages/$INDEX_FILE" \
              --version "$VERSION" --archive "$ARCHIVE" --pyavrocd "$PYAVROCD" \
              --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ARCHIVE}"

      - name: Commit and push the index
        working-directory: pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The index already knew about this version"
            exit 0
          fi
          git commit -m "${GITHUB_REF_NAME}"
          git push origin gh-pages
